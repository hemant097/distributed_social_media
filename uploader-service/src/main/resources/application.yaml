spring:
  application:
    name: uploader-service
  config:
    import: classpath:cloudconfig.yaml


server:
  port: 9050
  servlet:
    context-path: /uploads


eureka.client.service-url.defaultZone: http://localhost:8761/eureka

---

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false


spring:
  config:
    activate:
      on-profile: k8s
