apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: noviceanemone/social-user-service:latest
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: DB_USERNAME
          value: user
        - name: DB_PASSWORD
          value: password
        - name: DB_SERVER
          valueFrom:
            configMapKeyRef:
              name: my-config
              key: USER_DB_SERVICE
        - name: DB_NAME
          value: userDB
        ports:
        - containerPort: 9020


---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
  - port: 80
    targetPort: 9020

