apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: noviceanemone/social-notification-service:latest
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: DB_USERNAME
          value: user
        - name: DB_PASSWORD
          value: password
        - name: DB_NAME
          value: notificationDB
        - name: DB_SERVER
          valueFrom:
            configMapKeyRef:
              name: my-config
              key: NOTIFICATION_DB_SERVICE
        ports:
        - containerPort: 9040


---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - port: 80
    targetPort: 9040

