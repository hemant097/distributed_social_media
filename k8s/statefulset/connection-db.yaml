apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: connection-db
spec:
  selector:
    matchLabels:
      app: connection-db
  serviceName: connection-db
  replicas: 1
  template:
    metadata:
      labels:
        app: connection-db
    spec:
      containers:
      - name: connection-db
        image: neo4j:2026-community-trixie
        resources:
          limits:
            memory: "4Gi"
            cpu: "200m"
          requests:
            memory: "600Mi"
            cpu: "100m"
        env:
          - name: NEO4J_AUTH  
            value: "neo4j/password"
          - name: NEO4j_dbms_memory_heap_initial_size
            value: "512M"
          - name: NEO4j_dbms_memory_heap_max__size
            value: "2G"
          - name: NEO4J_server_default__listen__address
            value: "0.0.0.0"
          - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
            value: "yes"
          - name: NEO4J_initial_dbms_default__database
            value: "connectionDB"
        ports:
          - containerPort: 7687 #Bolt
        volumeMounts:
          - name: neo4j-data
            mountPath: /data
          - name: neo4j-logs
            mountPath: /logs
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: neo4j-logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi


---

apiVersion: v1
kind: Service
metadata:
  name: connection-db
  labels:
    app: connection-db
spec:
  clusterIP: None
  ports:
  - port: 7687
    targetPort: 7687
    name: bolt
  selector:
    app: connection-db

